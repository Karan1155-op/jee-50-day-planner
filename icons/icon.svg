<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1e" />
      <stop offset="100%" stop-color="#181d38" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(99,102,241,0.35)" stroke-width="6" />

  <!-- Atomic Orbits -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="190" ry="74" fill="none" stroke="url(#orbitGrad1)" stroke-width="9" transform="rotate(-32)" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="190" ry="74" fill="none" stroke="url(#orbitGrad2)" stroke-width="9" transform="rotate(32)" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="190" ry="74" fill="none" stroke="#10b981" stroke-width="8" transform="rotate(90)" opacity="0.85" />
    
    <!-- Orbit Electrons -->
    <circle cx="160" cy="-60" r="10" fill="#38bdf8" />
    <circle cx="-150" cy="70" r="10" fill="#f43f5e" />
    <circle cx="0" cy="-185" r="9" fill="#34d399" />
  </g>

  <!-- Core Circle -->
  <circle cx="256" cy="256" r="88" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="112" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="2" />

  <!-- Center Text -->
  <text x="256" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">JEE</text>

  <!-- 50 Days Badge -->
  <g transform="translate(256, 385)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">50 DAYS</text>
  </g>
</svg>
