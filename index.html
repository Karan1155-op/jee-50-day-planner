<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JEE 50-Day Study Planner</title>
<meta name="description" content="Interactive 50-day JEE syllabus completion routine and lecture tracker" />
<meta name="theme-color" content="#05060e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JEE Planner" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/x-icon" href="./favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #05060e;
  --bg-secondary: #0a0c1a;
  --bg-card: rgba(255,255,255,0.028);
  --bg-card-hover: rgba(255,255,255,0.05);
  --bg-elevated: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.12);
  --border-accent: rgba(99,102,241,0.25);
  --text-primary: #eef0f6;
  --text-secondary: #8891ab;
  --text-muted: #4e5672;
  --physics: #3b82f6;
  --physics-bg: rgba(59,130,246,0.1);
  --physics-border: rgba(59,130,246,0.2);
  --maths: #10b981;
  --maths-bg: rgba(16,185,129,0.1);
  --maths-border: rgba(16,185,129,0.2);
  --inorganic: #f59e0b;
  --inorganic-bg: rgba(245,158,11,0.1);
  --inorganic-border: rgba(245,158,11,0.2);
  --organic: #a855f7;
  --organic-bg: rgba(168,85,247,0.1);
  --organic-border: rgba(168,85,247,0.2);
  --accent: #6366f1;
  --accent-light: #818cf8;
  --accent-bg: rgba(99,102,241,0.1);
  --accent-glow: rgba(99,102,241,0.25);
  --success: #22c55e;
  --success-bg: rgba(34,197,94,0.1);
  --danger: #ef4444;
  --rest: #f97316;
  --radius: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --nav-height: 64px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 5%, rgba(99,102,241,0.07), transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 80%, rgba(168,85,247,0.05), transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ========== NAVBAR ========== */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-height);
  background: rgba(5,6,14,0.82);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em;
  cursor: pointer; user-select: none;
}
.nav-brand-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), #a855f7);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.nav-brand span { 
  background: linear-gradient(135deg, #fff, #a5b4fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.nav-links {
  display: flex; align-items: center; gap: 4px;
}
.nav-link {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 0.85rem; font-weight: 500;
  color: var(--text-secondary); cursor: pointer;
  transition: all var(--transition); border: none; background: none;
  font-family: inherit; white-space: nowrap;
  position: relative;
}
.nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
.nav-link.active {
  color: var(--accent-light); background: var(--accent-bg);
}
.nav-link.active::after {
  content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2px; border-radius: 2px;
  background: var(--accent);
}
.nav-link-icon { font-size: 1rem; }
.nav-progress-badge {
  margin-left: 12px; padding: 5px 14px; border-radius: 100px;
  font-size: 0.75rem; font-weight: 700;
  background: var(--accent-bg); border: 1px solid var(--border-accent);
  color: var(--accent-light);
}
/* ========== BOTTOM NAVIGATION (MOBILE PWA) ========== */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(58px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(6, 8, 18, 0.94);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  z-index: 100;
  align-items: stretch;
  justify-content: space-around;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.5);
}
.bottom-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: inherit;
  cursor: pointer;
  position: relative;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
  padding: 4px 0;
}
.bottom-nav-item:active {
  transform: scale(0.93);
}
.bottom-nav-item.active {
  color: #fff;
}
.bottom-nav-icon {
  font-size: 1.15rem;
  line-height: 1;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.bottom-nav-item.active .bottom-nav-icon {
  transform: translateY(-2px) scale(1.12);
}
.bottom-nav-label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-secondary);
}
.bottom-nav-item.active .bottom-nav-label {
  color: var(--accent-light);
}
.bottom-nav-indicator {
  position: absolute;
  top: 0;
  width: 18px;
  height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: linear-gradient(90deg, var(--accent), #a855f7);
  opacity: 0;
  transition: opacity 0.2s ease, width 0.2s ease;
}
.bottom-nav-item.active .bottom-nav-indicator {
  opacity: 1;
  width: 24px;
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .bottom-nav { display: flex; }
  .navbar { padding: 0 16px; }
  .nav-progress-badge { margin-left: 6px; padding: 4px 10px; font-size: 0.72rem; }
  .nav-install-btn { padding: 5px 10px; font-size: 0.75rem; }
  .main { padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px)); }
}

@media (max-width: 600px) {
  .dashboard-hero { gap: 20px; margin-bottom: 24px; }
  .ring-container { width: 160px; height: 160px; }
  .ring-percent { font-size: 2.4rem; }
  .hero-welcome { font-size: 1.35rem; }
  .hero-sub { font-size: 0.84rem; margin-bottom: 12px; }
}

/* ========== MAIN ========== */
.main {
  position: relative; z-index: 1;
  max-width: 1120px; margin: 0 auto;
  padding: calc(var(--nav-height) + 28px) 24px 60px;
}

/* ========== PAGE TRANSITION ========== */
.page { animation: page-in 0.35s ease forwards; }
@keyframes page-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== PAGE HEADER ========== */
.page-header { margin-bottom: 28px; }
.page-header h1 {
  font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.page-header p { color: var(--text-secondary); font-size: 0.9rem; }

/* ========== CARDS ========== */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px;
  transition: all var(--transition);
}
.card:hover { border-color: var(--border-hover); }
.card-title {
  font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

/* ========== GRID LAYOUTS ========== */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .main { padding-left: 14px; padding-right: 14px; }
}

/* ========== COMPACT 2x2 STAT CARDS ========== */
.stats-grid-2x2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.stat-card-compact {
  padding: 12px 10px;
  text-align: center;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.stat-card-compact:hover {
  border-color: var(--border-hover);
  background: var(--bg-card-hover);
}
.stat-card-compact .stat-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 1.05rem;
  margin-bottom: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.stat-card-compact .stat-value {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.stat-card-compact .stat-label {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ========== STAT CARDS (STANDARD) ========== */
.stat-card { text-align: center; padding: 22px 16px; }
.stat-icon {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.3rem; margin-bottom: 10px;
}
.stat-value { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.stat-label { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }

/* ========== PROGRESS RING ========== */
.dashboard-hero {
  display: flex; align-items: center; gap: 40px; margin-bottom: 32px;
  flex-wrap: wrap; justify-content: center;
}
.ring-container { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
.ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
.ring-fill {
  fill: none; stroke: url(#grad1); stroke-width: 8; stroke-linecap: round;
  transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
}
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-percent { font-size: 3rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
.ring-label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; margin-top: 4px; }

.hero-right { flex: 1; min-width: 260px; }
.hero-welcome { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
.hero-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }

/* ========== TODAY CARD ========== */
.today-card {
  background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.06));
  border: 1px solid var(--border-accent); border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 28px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.today-icon { font-size: 2.2rem; flex-shrink: 0; }
.today-content { flex: 1; min-width: 200px; }
.today-title { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
.today-sub { font-size: 0.84rem; color: var(--text-secondary); }
.today-btn {
  padding: 10px 22px; border-radius: var(--radius-sm); border: none;
  background: var(--accent); color: #fff; font-weight: 600;
  font-size: 0.85rem; cursor: pointer; font-family: inherit;
  transition: all var(--transition);
}
.today-btn:hover { background: #5558e6; transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }

/* ========== SUBJECT BARS ========== */
.subject-bar-card { padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
.subject-bar-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.subject-bar-info { flex: 1; min-width: 0; }
.subject-bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.subject-bar-name { font-size: 0.88rem; font-weight: 600; }
.subject-bar-count { font-size: 0.78rem; color: var(--text-secondary); font-weight: 500; }
.progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 100px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
.subject-bar-percent { font-size: 0.9rem; font-weight: 700; min-width: 44px; text-align: right; }
.subject-bar-card.done { border-color: rgba(34,197,94,0.2); background: rgba(34,197,94,0.03); }
.subject-bar-card.done .subject-bar-percent { color: var(--success); }

/* ========== WEEK TABS ========== */
.week-nav { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.week-nav::-webkit-scrollbar { display: none; }
.week-btn {
  padding: 10px 20px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: all var(--transition); display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 110px;
}
.week-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-hover); }
.week-btn.active { background: var(--accent-bg); border-color: var(--border-accent); color: var(--accent-light); }
.week-btn-sub { font-size: 0.68rem; font-weight: 400; }
.week-btn.wk-done .week-btn-sub { color: var(--success); }

/* ========== DAY CARDS ========== */
.day-list { display: flex; flex-direction: column; gap: 12px; }
.day-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; transition: all var(--transition);
}
.day-card:hover { border-color: var(--border-hover); }
.day-card.today-card-highlight { border-color: var(--border-accent); box-shadow: 0 0 24px rgba(99,102,241,0.06); }
.day-card.day-done { border-color: rgba(34,197,94,0.18); }
.day-card.day-rest { border-color: rgba(249,115,22,0.12); }

.day-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: rgba(255,255,255,0.012);
  border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px;
}
.day-head-left { display: flex; align-items: center; gap: 12px; }
.day-badge {
  font-size: 0.78rem; font-weight: 700; padding: 3px 12px; border-radius: 100px;
  white-space: nowrap;
}
.day-badge-default { color: var(--accent-light); background: var(--accent-bg); }
.day-badge-rest { color: var(--rest); background: rgba(249,115,22,0.1); }
.day-badge-done { color: var(--success); background: var(--success-bg); }
.day-date-text { font-size: 0.9rem; font-weight: 600; }
.day-dow-text { color: var(--text-secondary); font-weight: 400; }
.day-head-right { display: flex; align-items: center; gap: 10px; }
.day-lec-count { font-size: 0.78rem; color: var(--text-secondary); }
.day-time-badge { font-size: 0.72rem; color: var(--text-muted); background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 100px; }
.day-today-tag {
  font-size: 0.68rem; font-weight: 700; color: #fff; background: var(--accent);
  padding: 3px 12px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em;
  animation: glow-pulse 2s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100% { box-shadow: 0 0 6px var(--accent-glow); }
  50% { box-shadow: 0 0 14px var(--accent-glow); }
}

.day-body { padding: 10px 14px 14px; }
.rest-body { padding: 24px; text-align: center; }
.rest-icon-big { font-size: 2.2rem; margin-bottom: 8px; display: block; }
.rest-title { font-weight: 600; margin-bottom: 4px; }
.rest-desc { font-size: 0.84rem; color: var(--text-secondary); }

/* ========== LECTURE ITEMS ========== */
.lec-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 10px;
  border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); user-select: none;
}
.lec-item:hover { background: rgba(255,255,255,0.025); }
.lec-item input { display: none; }
.lec-check {
  width: 22px; height: 22px; border-radius: var(--radius-xs);
  border: 2px solid rgba(255,255,255,0.13); display: flex; align-items: center;
  justify-content: center; transition: all var(--transition); flex-shrink: 0; position: relative;
}
.lec-check::after {
  content: ''; width: 10px; height: 6px;
  border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
  transform: rotate(-45deg) scale(0);
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1); position: absolute; top: 5px;
}
.lec-item.done .lec-check { background: var(--success); border-color: var(--success); }
.lec-item.done .lec-check::after { transform: rotate(-45deg) scale(1); }
.lec-item.done .lec-info { opacity: 0.4; }
.lec-item.done .lec-chapter-name { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.15); }

.lec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lec-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; transition: opacity var(--transition); flex-wrap: wrap; }
.lec-subj-tag {
  font-size: 0.62rem; font-weight: 700; padding: 2px 8px; border-radius: 100px;
  text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0;
}
.lec-chapter-name { font-size: 0.86rem; font-weight: 500; transition: all var(--transition); }
.lec-num { font-size: 0.73rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; flex-shrink: 0; }

/* ========== CHAPTERS PAGE ========== */
.chapter-filters { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.chapter-filter-btn {
  padding: 8px 18px; border-radius: 100px; font-size: 0.82rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; font-family: inherit; transition: all var(--transition);
}
.chapter-filter-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
.chapter-filter-btn.active { background: var(--accent-bg); border-color: var(--border-accent); color: var(--accent-light); }

.chapter-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: all var(--transition);
}
.chapter-card:hover { border-color: var(--border-hover); }
.chapter-card.ch-done { border-color: rgba(34,197,94,0.18); }
.chapter-card-head {
  padding: 18px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px;
}
.chapter-card-color {
  width: 4px; height: 40px; border-radius: 4px; flex-shrink: 0;
}
.chapter-card-info { flex: 1; min-width: 0; }
.chapter-card-name { font-size: 0.92rem; font-weight: 600; margin-bottom: 2px; }
.chapter-card.ch-done .chapter-card-name { color: var(--success); }
.chapter-card-meta { font-size: 0.76rem; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
.chapter-card-right { text-align: right; }
.chapter-card-percent { font-size: 1rem; font-weight: 700; }
.chapter-card-fraction { font-size: 0.72rem; color: var(--text-secondary); }
.chapter-card-bar { padding: 0 20px 4px; }
.chapter-card-bar .progress-track { height: 4px; }
.chapter-expand {
  border-top: 1px solid var(--border); padding: 8px 14px 14px;
  display: none;
}
.chapter-expand.open { display: block; }
.chapter-toggle-icon {

// ==================== UTILS ====================
function dayNum(){
  const now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
  return Math.floor((t-s)/864e5)+1;
}
function curWeek(){ const d=dayNum(); return d<1?0:d>50?6:Math.min(6,Math.floor((d-1)/7)); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return MONTHS[d.getMonth()]+' '+d.getDate(); }
function studyTime(lecs){
  if(!lecs) return '0h';
  let m=0; lecs.forEach(([s])=>m+=s==='physics'?90:75);
  const h=Math.floor(m/60),r=m%60; return r?h+'h '+r+'m':h+'h';
}
function weekDays(w){ return schedule.slice(w*7, w*7+7); }

function curTimeMin(){
  const d=new Date();
  return d.getHours()*60 + d.getMinutes();
}
function formatTime12(min){
  const h=Math.floor(min/60)%24;
  const m=min%60;
  const ampm=h>=12?'PM':'AM';
  const h12=h%12||12;
  const mStr=m<10?'0'+m:m;
  return `${h12}:${mStr} ${ampm}`;
}

function subjProg(subj){
  let t=0,d=0;
  Object.entries(chapters).forEach(([k,ch])=>{
    if(ch.subject!==subj) return; t+=ch.total;
    for(let i=1;i<=ch.total;i++) if(completed[lid(k,i)]) d++;
  });
  return {total:t,done:d,pct:t?Math.round(d/t*100):0};
}
function chapProg(key){
  const ch=chapters[key]; let d=0;
  for(let i=1;i<=ch.total;i++) if(completed[lid(key,i)]) d++;
  return {total:ch.total,done:d,pct:ch.total?Math.round(d/ch.total*100):0,complete:d===ch.total};
}
function weekProg(w){
  const ds=weekDays(w); let t=0,d=0;
  ds.forEach(dy=>{ if(dy.lectures){ t+=dy.lectures.length; dy.lectures.forEach(([,k,n])=>{ if(completed[lid(k,n)]) d++; }); }});
  return {total:t,done:d,complete:t>0&&d===t};
}
function dayProg(dy){
  if(!dy.lectures) return {total:0,done:0,complete:dy.rest};
  let d=0; dy.lectures.forEach(([,k,n])=>{ if(completed[lid(k,n)]) d++; });
  return {total:dy.lectures.length,done:d,complete:d===dy.lectures.length};
}
function totalDone(){ return Object.keys(completed).length; }
function daysLeft(){ return Math.max(0,50-dayNum()+1); }
function hoursDone(){
  let m=0;
  schedule.forEach(d=>{ if(d.lectures) d.lectures.forEach(([s,k,n])=>{ if(completed[lid(k,n)]) m+=s==='physics'?90:75; }); });
  return (m/60).toFixed(1);
}

    else if(nowMin >= 945 && nowMin < 1125) curBlock = 'Deep PYQ Practice Session (04:15 - 06:45 PM)';
    else if(nowMin >= 1125 && nowMin < 1185) curBlock = 'Exercise / Walk / Decompress (06:45 - 07:45 PM)';
    else if(nowMin >= 1185 && nowMin < 1245) curBlock = 'Dinner & Relaxation (07:45 - 08:45 PM)';
    else if(nowMin >= 1245 && nowMin < 1335) curBlock = 'Active Recall & Formula Revision (08:45 - 10:15 PM)';
    else if(nowMin >= 1335 && nowMin < 1365) curBlock = 'Night Wind-Down & Desk Prep (10:15 - 10:45 PM)';

  const slot4Active = hasStarted && (is4Lec ? nowMin>=870&&nowMin<945 : nowMin>=900&&nowMin<1080);

  const l4Name = is4Lec ? (pLecs[3] ? `${SM[pLecs[3][0]].icon} ${SM[pLecs[3][0]].label} (L${pLecs[3][2]})` : '🔬 Class 4') : (isRestDay ? '📖 Formulas' : '📚 3h PYQs');

      </div>
      <div class="routine-slot-mini ${slot2Active?'active-slot':''}">
        <div class="routine-slot-mini-time">08:45 - 10:00 AM</div>

      </div>
      <div class="routine-slot-mini ${slot3Active?'active-slot':''}">
        <div class="routine-slot-mini-time">${is4Lec?'10:30 - 11:45 AM':'12:30 - 01:45 PM'}</div>
        <div class="routine-slot-mini-name">${l3Name}</div>
      </div>
      <div class="routine-slot-mini ${slot4Active?'active-slot':''}">
        <div class="routine-slot-mini-time">${is4Lec?'02:30 - 03:45 PM':'03:00 - 06:00 PM'}</div>
        <div class="routine-slot-mini-name">${l4Name}</div>
      </div>
    </div>
  </div>`;

  // Stats (compact 2-column by 2-row layout)
  h+=`<div class="section"><div class="section-label">📊 Quick Stats</div><div class="stats-grid-2x2">
    <div class="card stat-card-compact"><div class="stat-icon" style="background:var(--accent-bg)">📖</div><div class="stat-value">${done}/${TOTAL}</div><div class="stat-label">Lectures Done</div></div>

  // Subject progress
  h+=`<div class="section"><div class="section-label">📈 Subject Progress</div><div class="grid-2">`;
  ['physics','maths','inorganic','organic'].forEach(s=>{
    const sp=subjProg(s), m=SM[s];
    h+=`<div class="card subject-bar-card${sp.pct===100?' done':''}">
      <div class="subject-bar-dot" style="background:${m.color}"></div>
      <div class="subject-bar-info">
        <div class="subject-bar-top"><span class="subject-bar-name">${m.icon} ${m.label}</span><span class="subject-bar-count">${sp.done}/${sp.total}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${sp.pct}%;background:${sp.pct===100?'var(--success)':m.color}"></div></div>
      </div>
      <div class="subject-bar-percent" style="color:${sp.pct===100?'var(--success)':m.color}">${sp.pct}%</div>
    </div>`;
  });
  h+=`</div></div>`;

  // Quick chapter milestones
  h+=`<div class="section"><div class="section-label">🏅 Chapter Milestones</div><div class="card"><div class="milestone-list">`;
  const chOrder=['aoi','cc','emi','de','ape','dfb','va','akca','pb','tdg','am','ac','rayop','modphy','prob','bio','poly','mag','lp','sa','met','wvop','emw','semi','cel','envch'];
  chOrder.forEach(k=>{
    const cp=chapProg(k), ch=chapters[k], m=SM[ch.subject];
    h+=`<div class="milestone-item">
      <span class="milestone-icon">${cp.complete?'✅':'📖'}</span>

    </div>`;
  });
  h+=`</div></div></div>`;

  h+=renderFooter();
  h+=`</div>`;
  return h;
}

// ==================== SCHEDULE ====================
function renderSchedule(){
  const dn=dayNum();
  if(activeWeek<0||activeWeek>6) activeWeek=curWeek();

  let h=`<div class="page">
    <div class="page-header"><h1>📅 Weekly Schedule</h1><p>Your day-by-day lecture plan — check off as you go</p></div>`;

  // Week tabs
  h+=`<div class="week-nav">`;
  for(let w=0;w<7;w++){
    const wp=weekProg(w);
    h+=`<button class="week-btn${w===activeWeek?' active':''}${wp.complete?' wk-done':''}" onclick="switchWeek(${w})">
      <span>Week ${w+1}</span><span class="week-btn-sub">${wp.done}/${wp.total}${wp.complete?' ✅':''}</span>
    </button>`;
  }
  h+=`</div>`;

  // Day cards
  h+=`<div class="day-list">`;
  weekDays(activeWeek).forEach(dy=>{
    const isToday=dy.day===dn, dp=dayProg(dy), isDone=!dy.rest&&dp.complete;
    const cls=`day-card${isToday?' today-card-highlight':''}${dy.rest?' day-rest':''}${isDone?' day-done':''}`;
    h+=`<div class="${cls}" id="day-${dy.day}">`;
    // Header
    const badgeCls=isDone?'day-badge-done':dy.rest?'day-badge-rest':'day-badge-default';
    h+=`<div class="day-head"><div class="day-head-left">
      <span class="day-badge ${badgeCls}">${isDone?'✓ ':''}Day ${dy.day}</span>
      <span class="day-date-text">${fmtDate(dy.date)} <span class="day-dow-text">(${dy.dow})</span></span>
    </div><div class="day-head-right">`;
    if(isToday) h+=`<span class="day-today-tag">Today</span>`;
    if(dy.rest) h+=`<span class="day-lec-count" style="color:var(--rest)">Rest Day</span>`;
    else h+=`<span class="day-lec-count">${dp.done}/${dp.total} done</span><span class="day-time-badge">⏱ ${studyTime(dy.lectures)}</span>`;
    h+=`</div></div>`;

    // Body
    if(dy.rest){
      h+=`<div class="rest-body"><span class="rest-icon-big">${dy.complete?'🏆🎊🏆':'😌'}</span>
        <div class="rest-title">${dy.complete?'Syllabus Complete!':'Rest & Recharge'}</div>
        <div class="rest-desc">${dy.restNote}</div></div>`;
    } else {
      h+=`<div class="day-body">`;
      dy.lectures.forEach(([subj,chKey,num])=>{
        const ch=chapters[chKey], m=SM[subj], id=lid(chKey,num), chk=!!completed[id];
        h+=`<label class="lec-item${chk?' done':''}" data-id="${id}">
          <input type="checkbox" ${chk?'checked':''} onchange="toggle('${id}',this.checked)"/>
          <span class="lec-check"></span>
          <span class="lec-dot" style="background:${m.color}"></span>
          <span class="lec-info">
            <span class="lec-subj-tag" style="background:${m.bg};color:${m.color}">${m.label}</span>
            <span class="lec-chapter-name">${ch.name}</span>
            <span class="lec-num">L${num}/${ch.total}</span>
          </span>
        </label>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  h+=renderFooter();
  h+=`</div>`;
  return h;
}

// ==================== CHAPTERS ====================
function renderChapters(){
  let h=`<div class="page">
    <div class="page-header"><h1>📚 Chapter Progress</h1><p>Track each chapter — expand to check individual lectures</p></div>`;

  // Filters
  h+=`<div class="chapter-filters">
    <button class="chapter-filter-btn${chapterFilter==='all'?' active':''}" onclick="filterChapters('all')">All</button>`;
  ['physics','maths','inorganic','organic'].forEach(s=>{
    const m=SM[s];
    h+=`<button class="chapter-filter-btn${chapterFilter===s?' active':''}" onclick="filterChapters('${s}')">${m.icon} ${m.label}</button>`;
  });
  h+=`</div>`;

  // Chapter cards
  const keys=Object.keys(chapters).filter(k=>chapterFilter==='all'||chapters[k].subject===chapterFilter);
  // Sort: incomplete first, then by subject
  const sorted=keys.sort((a,b)=>{
    const ca=chapProg(a).complete, cb=chapProg(b).complete;
    if(ca!==cb) return ca?1:-1;
    return 0;
  });

  h+=`<div style="display:flex;flex-direction:column;gap:12px">`;
  sorted.forEach(k=>{
    const ch=chapters[k], cp=chapProg(k), m=SM[ch.subject], isExp=!!expandedChapters[k];
    h+=`<div class="chapter-card${cp.complete?' ch-done':''}">
      <div class="chapter-card-head" onclick="toggleChapter('${k}')">
        <div class="chapter-card-color" style="background:${cp.complete?'var(--success)':m.color}"></div>
        <div class="chapter-card-info">
          <div class="chapter-card-name">${ch.name}</div>
          <div class="chapter-card-meta">
            <span class="lec-subj-tag" style="background:${m.bg};color:${m.color}">${m.label}</span>
            <span>${ch.total} lecture${ch.total!==1?'s':''}</span>
          </div>
        </div>
        <div class="chapter-card-right">
          <div class="chapter-card-percent" style="color:${cp.complete?'var(--success)':m.color}">${cp.pct}%</div>
          <div class="chapter-card-fraction">${cp.done}/${cp.total}</div>
        </div>
        <span class="chapter-toggle-icon${isExp?' expanded':''}">▼</span>
      </div>
      <div class="chapter-card-bar"><div class="progress-track"><div class="progress-fill" style="width:${cp.pct}%;background:${cp.complete?'var(--success)':m.color}"></div></div></div>
      <div class="chapter-expand${isExp?' open':''}">`;
    for(let i=1;i<=ch.total;i++){
      const id=lid(k,i), chk=!!completed[id];
      h+=`<label class="lec-item${chk?' done':''}" data-id="${id}">
        <input type="checkbox" ${chk?'checked':''} onchange="toggle('${id}',this.checked)"/>
        <span class="lec-check"></span>
        <span class="lec-dot" style="background:${m.color}"></span>
        <span class="lec-info">
          <span class="lec-chapter-name">Lecture ${i}</span>
          <span class="lec-num">${i}/${ch.total}</span>
        </span>
      </label>`;
    }
    h+=`</div></div>`;
  });
  h+=`</div>`;
  h+=renderFooter();
  h+=`</div>`;
  return h;
}

// ==================== ANALYTICS ====================
function renderAnalytics(){
  const done=totalDone(), pct=Math.round(done/TOTAL*100);
  const dn=dayNum(), hrs=hoursDone();

  // Pace calculation
  let paceClass='pace-on-track', paceLabel='On Track', paceDesc='';
  if(dn>=1 && dn<=50){
    const expected=Math.round((dn/50)*TOTAL);
    const diff=done-expected;
    if(diff>3){paceClass='pace-ahead';paceLabel='Ahead of Schedule 🚀';paceDesc=`You're ${diff} lectures ahead!`;}
    else if(diff<-3){paceClass='pace-behind';paceLabel='Behind Schedule';paceDesc=`You're ${Math.abs(diff)} lectures behind. Time to catch up!`;}
    else{paceLabel='On Track ✅';paceDesc=`Expected ~${expected} by Day ${dn}. You have ${done}. Solid pace!`;}
  } else if(dn<1){paceDesc='Schedule hasn\'t started yet.';paceLabel='Waiting to Start';}
  else{paceDesc=done===TOTAL?'All lectures completed!':'Schedule period is over.';paceLabel=done===TOTAL?'Mission Complete! 🏆':'Period Ended';}

  let h=`<div class="page">
    <div class="page-header"><h1>📊 Analytics</h1><p>Detailed breakdown of your study progress</p></div>`;

  // Pace card
  h+=`<div class="section"><div class="card pace-card">
    <div class="pace-indicator ${paceClass}">${paceLabel}</div>
    <div class="pace-desc">${paceDesc}</div>
  </div></div>`;

  // Overall stats
  h+=`<div class="section"><div class="section-label">📋 Overall Numbers</div><div class="grid-4">
    <div class="card stat-card"><div class="stat-icon" style="background:var(--accent-bg)">📖</div><div class="stat-value">${done}</div><div class="stat-label">Completed</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.1)">📝</div><div class="stat-value">${TOTAL-done}</div><div class="stat-label">Remaining</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--maths-bg)">⏱️</div><div class="stat-value">${hrs}h</div><div class="stat-label">Hours Done</div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--organic-bg)">📐</div><div class="stat-value">${(200-parseFloat(hrs)).toFixed(1)}h</div><div class="stat-label">Hours Left</div></div>
  </div></div>`;

  // Subject breakdown
  h+=`<div class="section"><div class="section-label">📈 Subject Breakdown</div><div class="card"><div class="bar-chart">`;
  ['physics','maths','inorganic','organic'].forEach(s=>{
    const sp=subjProg(s), m=SM[s];
    h+=`<div class="bar-row">
      <div class="bar-label">${m.icon} ${m.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(sp.pct,2)}%;background:${sp.pct===100?'var(--success)':m.color}"><span class="bar-fill-text">${sp.pct}%</span></div></div>
      <div class="bar-value">${sp.done}/${sp.total}</div>
    </div>`;
  });
  h+=`</div></div></div>`;

  // Weekly progress
  h+=`<div class="section"><div class="section-label">📅 Weekly Progress</div><div class="card"><div class="bar-chart">`;
  for(let w=0;w<7;w++){
    const wp=weekProg(w), wpct=wp.total?Math.round(wp.done/wp.total*100):0;
    h+=`<div class="bar-row">
      <div class="bar-label">Week ${w+1}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(wpct,2)}%;background:${wp.complete?'var(--success)':'var(--accent)'}"><span class="bar-fill-text">${wpct}%</span></div></div>
      <div class="bar-value">${wp.done}/${wp.total}</div>
    </div>`;
  }
  h+=`</div></div></div>`;

  // Chapters completion count per subject
  h+=`<div class="section"><div class="section-label">🏅 Chapters Completed</div><div class="grid-4">`;
  ['physics','maths','inorganic','organic'].forEach(s=>{
    const m=SM[s];
    const ks=Object.keys(chapters).filter(k=>chapters[k].subject===s);
    const doneCount=ks.filter(k=>chapProg(k).complete).length;
    h+=`<div class="card stat-card">
      <div class="stat-icon" style="background:${m.bg}">${m.icon}</div>
      <div class="stat-value">${doneCount}/${ks.length}</div>
      <div class="stat-label">${m.label} chapters</div>
    </div>`;
  });
  h+=`</div></div>`;

  // All chapters status
  h+=`<div class="section"><div class="section-label">📋 All Chapters</div><div class="grid-2">`;
  ['physics','maths','inorganic','organic'].forEach(s=>{
    const m=SM[s];
    const ks=Object.keys(chapters).filter(k=>chapters[k].subject===s);
    h+=`<div class="card"><div class="card-title"><span class="subject-bar-dot" style="background:${m.color}"></span>${m.icon} ${m.label}</div>`;
    ks.forEach(k=>{
      const cp=chapProg(k), ch=chapters[k];
      h+=`<div class="milestone-item">
        <span class="milestone-icon">${cp.complete?'✅':cp.done>0?'🔄':'⬜'}</span>
        <span class="milestone-name" style="${cp.complete?'color:var(--success)':''}">${ch.name}</span>
        <span class="milestone-status ${cp.complete?'milestone-done':'milestone-pending'}">${cp.complete?'Done':cp.done+'/'+cp.total}</span>
      </div>`;
    });
    h+=`</div>`;
  });
  h+=`</div></div>`;

  h+=renderFooter();
  h+=`</div>`;
  return h;
}

// ==================== FOOTER ====================
function renderFooter(){
  return `<footer class="footer">
    <p>Built with 💪 for JEE 2027 Prep • Progress saved locally in your browser</p>
    <button class="reset-btn" onclick="resetAll()">🗑 Reset All Progress</button>
  </footer>`;
}

// ==================== EVENTS ====================
function toggle(id, checked){
  const prev={};
  Object.keys(chapters).forEach(k=>prev[k]=chapProg(k).complete);

  if(checked) completed[id]=true; else delete completed[id];
  save();

  if(checked){
    Object.keys(chapters).forEach(k=>{
      if(chapProg(k).complete && !prev[k]){
        const ch=chapters[k], m=SM[ch.subject];
        showToast('🎉 '+ch.name+' — Complete!','success');
        const sp=subjProg(ch.subject);
        if(sp.pct===100) setTimeout(()=>{showToast('🏆 '+m.label+' — ALL DONE!','milestone');confetti();},500);
      }
    });
  }

  renderNav(); renderPage();
}

function switchWeek(w){ activeWeek=w; renderPage(); }
function scrollToDay(d){
  const w=Math.min(6,Math.floor((d-1)/7));
  if(activeWeek!==w){activeWeek=w; renderPage();}
  setTimeout(()=>{const el=document.getElementById('day-'+d);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},80);
}
function filterChapters(f){ chapterFilter=f; renderPage(); }
function toggleChapter(k){ expandedChapters[k]=!expandedChapters[k]; renderPage(); }
function resetAll(){
  if(confirm('Reset ALL progress? This cannot be undone!'))
    if(confirm('Are you sure? All checkmarks will be permanently erased!')){
      completed={}; save(); renderNav(); renderPage(); showToast('Progress reset.','success');
    }
}

// ==================== TOAST & CONFETTI ====================
function showToast(msg,type='success'){
  const c=document.getElementById('toast-container'),t=document.createElement('div');
  t.className='toast toast-'+type; t.textContent=msg; c.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},3500);
}
function confetti(){
  const w=document.createElement('div');w.className='confetti-wrap';document.body.appendChild(w);
  const cols=['#6366f1','#a855f7','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#22c55e'];
  for(let i=0;i<50;i++){
    const p=document.createElement('div');p.className='confetti-p';
    p.style.left=Math.random()*100+'%';p.style.top='-10px';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDelay=Math.random()*1.2+'s';
    p.style.animationDuration=(2+Math.random()*2)+'s';
    p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';
    p.style.borderRadius=Math.random()>0.5?'50%':'2px';
    w.appendChild(p);
  }
  setTimeout(()=>w.remove(),4500);
}

// ==================== PWA INSTALL & SERVICE WORKER ====================
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallButtons();
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  updateInstallButtons();
  showToast('🎉 App installed! Open it directly from your home screen.', 'milestone');
});

function isAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function updateInstallButtons() {
  const btns = document.querySelectorAll('.nav-install-btn');
  const installed = isAppInstalled();
  btns.forEach(btn => {
    btn.style.display = installed ? 'none' : 'inline-flex';
  });
}

function openInstallModal() {
  const modal = document.getElementById('install-modal');
  const instructions = document.getElementById('install-instructions');
  const actionBtn = document.getElementById('modal-install-btn');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  if (deferredInstallPrompt) {
    instructions.innerHTML = `
      <p style="margin-bottom: 6px;"><strong>Ready to install:</strong></p>
      <p>Tap <strong>"Install Now"</strong> below to add JEE Planner to your device for fast 1-tap launch and full-screen experience.</p>
    `;
    actionBtn.style.display = 'inline-block';
    actionBtn.textContent = 'Install Now';
  } else if (isIOS) {
    instructions.innerHTML = `
      <p style="margin-bottom: 8px;"><strong>To install on iPhone / iPad Safari:</strong></p>
      <ol style="margin-left: 20px; line-height: 1.7;">
        <li>Tap the <strong>Share</strong> button <span style="font-size:1.1rem">⎋</span> at the bottom.</li>
        <li>Scroll down and tap <strong>"Add to Home Screen"</strong> <span style="font-size:1.1rem">➕</span>.</li>
        <li>Tap <strong>Add</strong> in the top-right corner.</li>
      </ol>
    `;
    actionBtn.style.display = 'none';
  } else {
    instructions.innerHTML = `
      <p style="margin-bottom: 8px;"><strong>To install on your phone / browser:</strong></p>
      <ol style="margin-left: 20px; line-height: 1.7;">
        <li>Tap the browser menu <span style="font-size:1.1rem">⋮</span> (top right in Chrome/Edge).</li>
        <li>Select <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong>.</li>
        <li>Follow the quick prompt to place it on your home screen.</li>
      </ol>
    `;
    actionBtn.style.display = 'none';
  }

  modal.style.display = 'flex';
}

function closeInstallModal(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('btn-close-modal')) return;
  document.getElementById('install-modal').style.display = 'none';
}

function triggerPwaInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        showToast('Installing JEE Planner...', 'success');
      }
      deferredInstallPrompt = null;
      closeInstallModal();
    });
  } else {
    closeInstallModal();
  }
}

// Service Worker Registration
if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('PWA Service Worker registered:', reg.scope);
      })
      .catch(err => {
        console.log('PWA Service Worker failed:', err);
      });
  });
}

// ==================== INIT ====================
load();
activeWeek=curWeek();
const hash=window.location.hash.slice(1);
if(['dashboard','routine','schedule','chapters','analytics'].includes(hash)) activePage=hash;
renderNav();
renderPage();
window.addEventListener('hashchange',()=>{
  const r=window.location.hash.slice(1);
  if(['dashboard','routine','schedule','chapters','analytics'].includes(r)&&r!==activePage){activePage=r;renderNav();renderPage();}
});
</script>
